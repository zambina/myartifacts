<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivio</title>
<style>
  :root {
    --paper: #f4f1ea;
    --ink: #141414;
    --mute: #6b675f;
    --line: #141414;
    --accent: #d7261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #121212; --ink: #ece8df; --mute: #8d887e; --line: #3a3833; --accent: #ff5a4f; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  a { color: inherit; }

  /* ---------- testata ---------- */
  header { padding: 28px 16px 0; max-width: 1600px; margin: 0 auto; }
  .dateline {
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    text-transform: uppercase; letter-spacing: .12em; font-size: 10px; color: var(--mute);
    border-bottom: 1px solid var(--line); padding-bottom: 6px;
  }
  h1 {
    font-family: "Bodoni 72", Didot, "Playfair Display", Georgia, "Times New Roman", serif;
    font-weight: 700; font-size: clamp(54px, 13vw, 190px); line-height: .86;
    letter-spacing: -.035em; margin: 14px 0 10px; text-transform: uppercase;
    overflow-wrap: anywhere;
  }
  .bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border-top: 4px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 8px 0; margin-bottom: 16px;
  }
  .bar .count { margin-right: auto; text-transform: uppercase; letter-spacing: .12em; font-size: 10px; }
  input[type=search] {
    font: inherit; color: inherit; background: transparent; border: 1px solid var(--line);
    padding: 6px 8px; width: 170px; border-radius: 0; outline-offset: 2px;
  }
  .btn {
    font: inherit; text-transform: uppercase; letter-spacing: .1em; font-size: 10px;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    padding: 7px 10px; cursor: pointer; text-decoration: none; display: inline-block; border-radius: 0;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  /* ---------- griglia ---------- */
  main { max-width: 1600px; margin: 0 auto; padding: 0 16px 60px; }
  #grid {
    --s: .2;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 1px; background: var(--line); border: 1px solid var(--line);
  }
  #grid:empty { display: none; }
  .tile {
    position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: var(--paper);
    display: block; text-decoration: none; cursor: pointer;
  }
  .tile .pv { position: absolute; inset: 0; overflow: hidden; background: #fff; }
  .tile .pv iframe {
    position: absolute; top: 0; left: 0; width: 1200px; height: 1200px; border: 0;
    transform-origin: 0 0; transform: scale(var(--s)); pointer-events: none; background: #fff;
  }
  .tile .pv img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 9px;
    background: var(--paper); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline;
  }
  .tile .n { color: var(--accent); font-size: 10px; }
  .tile .t {
    font-family: Georgia, "Times New Roman", serif; font-size: 15px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile .v { font-size: 10px; color: var(--mute); text-transform: uppercase; letter-spacing: .08em; }
  .tile:hover .cap, .tile:focus-visible .cap { background: var(--ink); color: var(--paper); }
  .tile:hover .v, .tile:focus-visible .v { color: var(--paper); }
  .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

  #msg { padding: 40px 0; max-width: 62ch; line-height: 1.6; font-size: 13px; }
  #msg:empty { display: none; }
  #msg b { font-family: Georgia, serif; font-size: 22px; display: block; margin-bottom: 8px; }
  #msg code { background: var(--ink); color: var(--paper); padding: 1px 5px; }

  /* ---------- visore ---------- */
  #viewer { position: fixed; inset: 0; background: var(--paper); display: none; flex-direction: column; z-index: 10; }
  #viewer.on { display: flex; }
  #viewer .top {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  #viewer .name {
    font-family: Georgia, serif; font-weight: 700; font-size: 17px; margin-right: auto;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #viewer select {
    font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line);
    padding: 6px; border-radius: 0; max-width: 40vw;
  }
  #viewer iframe { flex: 1; width: 100%; border: 0; background: #fff; }
</style>
</head>
<body>

<header>
  <div class="dateline"><span id="who">—</span><span id="today"></span></div>
  <h1 id="title">Archivio</h1>
  <div class="bar">
    <span class="count" id="count">…</span>
    <input type="search" id="q" placeholder="cerca…" aria-label="Cerca">
    <button class="btn" id="reload" title="Rileggi il repository">Aggiorna</button>
    <a class="btn primary" id="upload" target="_blank" rel="noopener">+ Carica</a>
  </div>
</header>

<main>
  <div id="msg"></div>
  <div id="grid"></div>
</main>

<div id="viewer" role="dialog" aria-modal="true">
  <div class="top">
    <span class="name" id="vname"></span>
    <select id="vsel" aria-label="Versione"></select>
    <a class="btn" id="vnew" target="_blank" rel="noopener">Nuova scheda ↗</a>
    <button class="btn" id="vclose">Chiudi ✕</button>
  </div>
  <iframe id="vframe" title="Artefatto"></iframe>
</div>

<script>
/* ============================================================
   CONFIG — lascia vuoto: su *.github.io si arrangia da sola.
   Compila owner/repo solo se usi un dominio tuo.
   ============================================================ */
const CONFIG = { owner: '', repo: '', title: 'Archivio' };

const IMG = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'avif'];
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const pretty = s => s.replace(/[-_]+/g, ' ').trim();
const natural = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });

let owner = CONFIG.owner, repo = CONFIG.repo, branch = 'main', projects = [];

/* ---------- dove siamo ---------- */
(function detect() {
  if (owner && repo) return;
  const host = location.hostname;
  if (!host.endsWith('.github.io')) return;
  owner = host.split('.')[0];
  const seg = location.pathname.split('/').filter(Boolean)[0];
  repo = seg && !/\.html?$/i.test(seg) ? seg : host;
})();

$('title').textContent = CONFIG.title;
document.title = CONFIG.title;
$('today').textContent = new Date().toLocaleDateString('it-CH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

/* ---------- GitHub ---------- */
async function gh(path) {
  const r = await fetch(`https://api.github.com/repos/${owner}/${repo}${path}`, { headers: { Accept: 'application/vnd.github+json' } });
  if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
  return r.json();
}

async function fetchTree(force) {
  const key = `archivio:${owner}/${repo}`;
  if (!force) {
    try {
      const c = JSON.parse(sessionStorage.getItem(key) || 'null');
      if (c && Date.now() - c.t < 5 * 60 * 1000) return c;
    } catch (e) {}
  }
  const info = await gh('');
  const tree = await gh(`/git/trees/${encodeURIComponent(info.default_branch)}?recursive=1`);
  const data = { t: Date.now(), branch: info.default_branch, paths: tree.tree.filter(x => x.type === 'blob').map(x => x.path) };
  try { sessionStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
  return data;
}

/* ---------- dal mucchio di file ai progetti ----------
   radice/nome.html                → progetto "nome"
   radice/nome.png                 → sua copertina (o progetto-immagine se è solo)
   radice/cartella/v1.html, v2…    → progetto "cartella" con versioni
   radice/cartella/v1/index.html   → idem, versione "v1"
   cartella/thumb.png | cover.png  → copertina del progetto
   ----------------------------------------------------- */
function build(paths) {
  const map = new Map();
  const get = k => { if (!map.has(k)) map.set(k, { name: k, versions: [], images: [], rootImg: null }); return map.get(k); };
  const isIndex = s => /^index\.html?$/i.test(s);
  const strip = s => s.replace(/\.[^.]+$/, '');

  for (const p of paths) {
    const seg = p.split('/');
    if (seg.some(s => /^[._]/.test(s))) continue;
    const ext = (seg[seg.length - 1].match(/\.([^.]+)$/) || [])[1];
    const e = ext ? ext.toLowerCase() : '';
    const isH = e === 'html' || e === 'htm', isI = IMG.includes(e);
    if (!isH && !isI) continue;

    if (seg.length === 1) {
      const base = strip(seg[0]);
      if (/^(index|404|readme)$/i.test(base)) continue;
      const pr = get(base);
      if (isH) pr.versions.push({ label: base, path: p }); else pr.rootImg = p;
    } else {
      const pr = get(seg[0]);
      if (isH) {
        if (seg.length === 2) pr.versions.push({ label: isIndex(seg[1]) ? seg[0] : strip(seg[1]), path: p });
        else if (seg.length === 3 && isIndex(seg[2])) pr.versions.push({ label: seg[1], path: p });
      } else if (seg.length <= 3) pr.images.push(p);
    }
  }

  const out = [];
  for (const pr of map.values()) {
    if (pr.versions.length) {
      pr.thumb = pr.rootImg || pr.images.find(i => /(thumb|cover|preview|anteprima|copertina)[^/]*$/i.test(i)) || null;
    } else {
      const imgs = pr.rootImg ? [pr.rootImg, ...pr.images] : pr.images;
      if (!imgs.length) continue;
      pr.versions = imgs.map(i => ({ label: strip(i.split('/').pop()), path: i }));
      pr.thumb = imgs.sort(natural)[imgs.length - 1];
    }
    pr.versions.sort((a, b) => natural(a.label, b.label));
    out.push(pr);
  }
  return out.sort((a, b) => natural(a.name, b.name));
}

/* ---------- griglia ---------- */
const io = new IntersectionObserver(entries => {
  for (const en of entries) {
    const pv = en.target.querySelector('.pv');
    if (en.isIntersecting) {
      if (pv.firstChild) continue;
      if (pv.dataset.img) {
        const im = el('img'); im.src = pv.dataset.img; im.alt = ''; im.loading = 'lazy'; pv.append(im);
      } else {
        const f = el('iframe'); f.src = pv.dataset.src; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true'); f.setAttribute('scrolling', 'no'); pv.append(f);
      }
    } else if (!pv.dataset.img) {
      pv.replaceChildren(); // le anteprime vive fuori schermo si spengono
    }
  }
}, { rootMargin: '200px' });

function render() {
  const q = $('q').value.trim().toLowerCase();
  const grid = $('grid');
  io.disconnect();
  grid.replaceChildren();
  const list = projects.filter(p => !q || p.name.toLowerCase().includes(q));
  list.forEach(p => {
    const last = p.versions[p.versions.length - 1];
    const a = el('a', 'tile');
    a.href = '#' + encodeURIComponent(p.name);
    const pv = el('div', 'pv');
    if (p.thumb) pv.dataset.img = enc(p.thumb); else pv.dataset.src = enc(last.path);
    const cap = el('div', 'cap');
    cap.append(
      el('span', 'n', '№ ' + String(projects.indexOf(p) + 1).padStart(2, '0')),
      el('span', 't', pretty(p.name)),
      el('span', 'v', p.versions.length > 1 ? p.versions.length + ' vers.' : '')
    );
    a.append(pv, cap);
    grid.append(a);
    io.observe(a);
  });
  $('count').textContent = projects.length
    ? (q ? `${list.length} di ${projects.length}` : `${projects.length} ${projects.length === 1 ? 'pezzo' : 'pezzi'} in archivio`)
    : 'Archivio vuoto';
  fit();
}

function fit() {
  const t = $('grid').firstElementChild;
  if (t) $('grid').style.setProperty('--s', t.clientWidth / 1200);
}
new ResizeObserver(fit).observe($('grid'));

/* ---------- visore ---------- */
function route() {
  const [name, label] = location.hash.slice(1).split('/').map(decodeURIComponent);
  const p = projects.find(x => x.name === name);
  const v = $('viewer');
  if (!p) { v.classList.remove('on'); $('vframe').removeAttribute('src'); document.body.style.overflow = ''; return; }
  const ver = p.versions.find(x => x.label === label) || p.versions[p.versions.length - 1];
  $('vname').textContent = pretty(p.name);
  const sel = $('vsel');
  sel.replaceChildren(...p.versions.map(x => { const o = el('option', '', x.label); o.value = x.label; return o; }));
  sel.value = ver.label;
  sel.style.display = p.versions.length > 1 ? '' : 'none';
  sel.onchange = () => { location.hash = encodeURIComponent(p.name) + '/' + encodeURIComponent(sel.value); };
  const url = enc(ver.path);
  if ($('vframe').getAttribute('src') !== url) $('vframe').src = url;
  $('vnew').href = url;
  v.classList.add('on');
  document.body.style.overflow = 'hidden';
}
const closeViewer = () => { history.pushState('', '', location.pathname + location.search); route(); };
$('vclose').onclick = closeViewer;
addEventListener('keydown', e => { if (e.key === 'Escape' && $('viewer').classList.contains('on')) closeViewer(); });
addEventListener('hashchange', route);

/* ---------- avvio ---------- */
function say(title, html) { const m = $('msg'); m.replaceChildren(el('b', '', title)); const d = el('div'); d.innerHTML = html; m.append(d); }

async function load(force) {
  if (!owner || !repo) {
    $('count').textContent = 'Non in linea';
    $('upload').style.display = 'none';
    say('Qui non c’è nessun archivio da leggere.',
      'Questa pagina funziona quando è pubblicata su GitHub Pages (<code>utente.github.io/repository</code>). ' +
      'Aperta dal disco non sa a quale repository chiedere. Se usi un dominio tuo, compila <code>CONFIG</code> in cima allo script.');
    return;
  }
  $('who').textContent = `${owner} / ${repo}`;
  try {
    const data = await fetchTree(force);
    branch = data.branch;
    $('upload').href = `https://github.com/${owner}/${repo}/upload/${encodeURIComponent(branch)}`;
    projects = build(data.paths);
    $('msg').replaceChildren();
    if (!projects.length) {
      say('Ancora niente in pagina.',
        'Premi <b style="display:inline;font-size:inherit;font-family:inherit">+ Carica</b>, trascina un file <code>.html</code> ' +
        '(o una cartella con dentro <code>v1.html</code>, <code>v2.html</code>…), conferma con «Commit changes» e torna qui dopo un minuto.');
    }
    render();
    route();
  } catch (e) {
    $('count').textContent = 'Errore';
    $('upload').href = `https://github.com/${owner}/${repo}`;
    if (e.status === 404) say('Repository non trovato.', `Cercavo <code>${owner}/${repo}</code>. Deve essere <u>pubblico</u>, altrimenti GitHub non mi lascia leggere l’elenco dei file.`);
    else if (e.status === 403) say('GitHub ha chiuso lo sportello.', 'Troppe richieste nell’ultima ora (il limite è 60). Riprova fra un po’.');
    else say('Qualcosa è andato storto.', String(e.message || e));
  }
}

$('q').addEventListener('input', render);
$('reload').onclick = () => load(true);
load(false);
</script>
</body>
</html>
