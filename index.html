<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Claude Artifacts Showcase</title>
    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-sidebar: #ffffff;
            --text-main: #212529;
            --accent-color: #3a83f7;
            --border-color: #dee2e6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-primary); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Styling */
        .sidebar { width: 320px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; }
        .header { padding: 24px; border-bottom: 1px solid var(--border-color); }
        .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; color: var(--text-main); }
        .header p { font-size: 13px; color: #6c757d; }
        
        .artifact-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .artifact-item { padding: 14px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: all 0.2s ease; text-align: left; }
        .artifact-item:hover { border-color: var(--accent-color); transform: translateY(-1px); }
        .artifact-item.active { background: #e8f3fe; border-color: var(--accent-color); }
        .artifact-item h3 { font-size: 14px; margin-bottom: 4px; font-weight: 600; }
        .artifact-item p { font-size: 12px; color: #6c757d; }

        /* Preview Area Styling */
        .preview-container { flex: 1; display: flex; flex-direction: column; height: 100%; background: #eee; }
        .preview-bar { background: #fff; padding: 12px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .preview-title { font-weight: 600; font-size: 14px; }
        .external-link { font-size: 13px; color: var(--accent-color); text-decoration: none; font-weight: 500; }
        .external-link:hover { text-decoration: underline; }
        
        .iframe-wrapper { flex: 1; position: relative; background: #ffffff; }
        iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
        .placeholder-text { display: flex; align-items: center; justify-content: center; height: 100%; color: #6c757d; font-size: 15px; background: var(--bg-primary); }
    </style>
</head>
<body>

    <!-- Sidebar Gallery Links -->
    <div class="sidebar">
        <div class="header">
            <h1>My Artifacts</h1>
            <p>Interactive apps built with Claude</p>
        </div>
        <div class="artifact-list">
            
            <!-- PROJECT 1 -->
            <button class="artifact-item active" onclick="loadPreview('artifacts/app1.html', 'Interactive Dashboard', this)">
                <h3>📊 Interactive Dashboard</h3>
                <p>Data visualization layout components.</p>
            </button>

            <!-- PROJECT 2 -->
            <button class="artifact-item" onclick="loadPreview('artifacts/game2.html', 'Retro Arcade Game', this)">
                <h3>🕹️ Retro Arcade Game</h3>
                <p>Pure HTML5 canvas game file.</p>
            </button>

            <!-- PROJECT 3 -->
            <button class="artifact-item" onclick="loadPreview('artifacts/chart3.html', 'Financial Planner', this)">
                <h3>🧮 Budget & Financial Planner</h3>
                <p>Calculators built with vanilla JS.</p>
            </button>

            <!-- Add future projects directly below this line following the same button format! -->

        </div>
    </div>

    <!-- Live Presentation Preview Screen -->
    <div class="preview-container">
        <div class="preview-bar">
            <span id="current-title" class="preview-title">Interactive Dashboard</span>
            <a id="current-link" class="external-link" href="myartifacts/inforene-1.18.2.html" target="_blank">Open Full Screen ↗</a>
            <a id="current-link" class="external-link" href="myartifacts/lanterna-v6.4.1s.html" target="_blank">Open Full Screen ↗</a>
            <a id="current-link" class="external-link" href="myartifacts/renes-mapper.html" target="_blank">Open Full Screen ↗</a>
            <a id="current-link" class="external-link" href="myartifacts/vettoria-v7.html" target="_blank">Open Full Screen ↗</a>
        </div>
        <div class="iframe-wrapper" id="view-wrapper">
            <!-- Set your default starting file path inside the src attribute below -->
            <iframe id="preview-frame" src="artifacts/app1.html"></iframe>
        </div>
    </div>

    <script>
        function loadPreview(url, title, element) {
            // Update iframe source target
            document.getElementById('preview-frame').src = url;
            // Update Top Bar Headings & Links
            document.getElementById('current-title').textContent = title;
            document.getElementById('current-link').href = url;
            
            // Toggle active focus states on list items
            const items = document.querySelectorAll('.artifact-item');
            items.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
